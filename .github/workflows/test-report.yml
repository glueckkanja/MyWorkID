name: 'Test Report'
on:
  workflow_call:

permissions:
  contents: read

jobs:
  report:
    name: Test report
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # Downloads the testResults artifact from the calling workflow run
      checks: write # Creates the check run that holds the test report
    steps:
      - uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          artifact: testResults
          name: test report
          path: '*.trx'
          reporter: dotnet-trx
          use-actions-summary: 'false' # Write summary into check run details instead of actions summary
