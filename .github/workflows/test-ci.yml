name: 'Test CI'

on:
  pull_request:

permissions:
  contents: read
  
env:
  DOTNET_CORE_VERSION: 10.0.x

jobs:
  run-tests:
    name: run tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore NuGet Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/MyWorkID.Server') }}
      - name: Setup .NET Core
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
      - name: Build
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore
      - name: Test
        shell: pwsh
        run: |
          dotnet test tests/MyWorkID.Server.UnitTests --configuration Release --no-build --results-directory TestResults --report-xunit-trx --report-xunit-trx-filename Unit-Tests.trx
          dotnet test tests/MyWorkID.Server.IntegrationTests --configuration Release --no-build --results-directory TestResults --report-xunit-trx --report-xunit-trx-filename Integration-Tests.trx
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success() || failure()
        with:
          name: testResults
          path: TestResults/*.trx

  publish-test-report:
    name: publish test report
    needs:
      - run-tests
    if: always()
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/test-report.yml
