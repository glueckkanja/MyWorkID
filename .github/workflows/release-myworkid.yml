name: Create MyWorkID Release
run-name: Create MyWorkID Release

concurrency:
  group: "Create MyWorkID Release"
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      suppress_release:
        description: Suppress creating a release in version generation
        default: false
        type: boolean
      is_draft_release:
        description: Mark release as draft
        default: false
        type: boolean
      is_prerelease:
        description: Mark release as prerelease
        default: false
        type: boolean
  push:
    paths:
      - "src/**"
    branches:
      - "main"

permissions:
  contents: read
  actions: read

env:
  BINARY_ARTIFACT_NAME: binaries
  RELEASE_ASSETS_DIRECTORY: release-assets

jobs:
  build_myworkid_binaries:
    permissions:
      contents: read
    uses: ./.github/workflows/build-binaries-reusable.yml

  generate_version:
    name: Generate version number
    permissions:
      contents: write
    uses: c4a8/c4a8-code-reusable-actions/.github/workflows/epoch-semver-version.yml@eafb1e2c28580ce3f27d89848f3fd6eaacb9253a # v2.0.0
    with:
      # Allow releases and tags only on main branch - Real releases can be created by using workflow_dispatch on main branch
      suppress_tag: ${{ github.ref_name != 'main' || (github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.suppress_release || 'false')) }}
      suppress_release: ${{ github.ref_name != 'main' || (github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.suppress_release || 'false')) }}
      is_draft_release: ${{ github.event_name != 'workflow_dispatch' || fromJSON(github.event.inputs.is_draft_release || 'false') }}
      is_prerelease: ${{ github.event_name != 'workflow_dispatch' || fromJSON(github.event.inputs.is_prerelease || 'false') }}

  prepare_and_create_release:
    name: Prepare release assets and create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    # Release creation is suppressed if the branch is not main or if the workflow_dispatch input suppress_release is true
    if: ${{ !(github.ref_name != 'main' || (github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.suppress_release || 'false'))) }}
    needs:
      - build_myworkid_binaries
      - generate_version
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download binaries artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: ${{ env.BINARY_ARTIFACT_NAME }}_${{ github.sha }}
          path: ${{ env.RELEASE_ASSETS_DIRECTORY }}

      - name: Package release archives
        shell: pwsh
        run: |
          $ReleaseAssetsDirectory = Join-Path $env:GITHUB_WORKSPACE $env:RELEASE_ASSETS_DIRECTORY
          $HashNamedArchivePath = Join-Path $ReleaseAssetsDirectory "$($env:BINARY_ARTIFACT_NAME)_$($env:GITHUB_SHA).zip"
          $StableArchivePath = Join-Path $ReleaseAssetsDirectory "$($env:BINARY_ARTIFACT_NAME).zip"

          $ItemsToArchive = Get-ChildItem -LiteralPath $ReleaseAssetsDirectory | Select-Object -ExpandProperty FullName
          Compress-Archive -LiteralPath $ItemsToArchive -DestinationPath $HashNamedArchivePath -Force
          Copy-Item -LiteralPath $HashNamedArchivePath -Destination $StableArchivePath -Force

      - name: Upload release assets to existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.generate_version.outputs.tag }}
        run: |
          $ReleaseAssetsDirectory = Join-Path $env:GITHUB_WORKSPACE $env:RELEASE_ASSETS_DIRECTORY
          $HashNamedArchivePath = Join-Path $ReleaseAssetsDirectory "$($env:BINARY_ARTIFACT_NAME)_$($env:GITHUB_SHA).zip"
          $StableArchivePath = Join-Path $ReleaseAssetsDirectory "$($env:BINARY_ARTIFACT_NAME).zip"

          if ([string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) {
            throw 'Generated release tag output is empty.'
          }

          $ReleaseUploadArguments = @(
            'release'
            'upload'
            $env:RELEASE_TAG
            $HashNamedArchivePath
            $StableArchivePath
            '--clobber'
          )

          gh @ReleaseUploadArguments
