name: Create MyWorkID Release
run-name: Create MyWorkID Release

concurrency:
  group: "Create MyWorkID Release"
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
    branches:
      - "main"

permissions:
  contents: write
  actions: read

env:
  BINARY_ARTIFACT_NAME: binaries
  RELEASE_ASSETS_DIRECTORY: release-assets

jobs:
  build_myworkid_binaries:
    uses: ./.github/workflows/build-binaries-reusable.yml

  generate_version:
    name: Generate prerelease version number
    uses: c4a8/c4a8-code-reusable-actions/.github/workflows/epoch-semver-version.yml@8222fbca3416c3396bfcd6372b58e2b422302a58 # v1.0.2
    with:
      suppress_release: true

  prepare_and_create_prerelease:
    name: Prepare release assets and create prerelease
    runs-on: ubuntu-latest
    needs:
      - build_myworkid_binaries
      - generate_version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download binaries artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.BINARY_ARTIFACT_NAME }}_${{ github.sha }}
          path: ${{ env.RELEASE_ASSETS_DIRECTORY }}

      - name: Package release archives
        shell: pwsh
        run: |
          $ReleaseAssetsDirectory = Join-Path $env:GITHUB_WORKSPACE $env:RELEASE_ASSETS_DIRECTORY
          $HashNamedArchivePath = Join-Path $ReleaseAssetsDirectory "$($env:BINARY_ARTIFACT_NAME)_$($env:GITHUB_SHA).zip"
          $StableArchivePath = Join-Path $ReleaseAssetsDirectory "$($env:BINARY_ARTIFACT_NAME).zip"

          $ItemsToArchive = Get-ChildItem -LiteralPath $ReleaseAssetsDirectory | Select-Object -ExpandProperty FullName
          Compress-Archive -LiteralPath $ItemsToArchive -DestinationPath $HashNamedArchivePath -Force
          Copy-Item -LiteralPath $HashNamedArchivePath -Destination $StableArchivePath -Force

      - name: Resolve release version
        id: resolve_release_version
        shell: pwsh
        run: |
          $ReleaseTag = git tag --points-at $env:GITHUB_SHA | Select-Object -First 1

          if ([string]::IsNullOrWhiteSpace($ReleaseTag)) {
            throw 'No release tag was found for the current commit.'
          }

          "release_tag=$ReleaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.resolve_release_version.outputs.release_tag }}
        run: |
          $ReleaseAssetsDirectory = Join-Path $env:GITHUB_WORKSPACE $env:RELEASE_ASSETS_DIRECTORY
          $HashNamedArchivePath = Join-Path $ReleaseAssetsDirectory "$($env:BINARY_ARTIFACT_NAME)_$($env:GITHUB_SHA).zip"
          $StableArchivePath = Join-Path $ReleaseAssetsDirectory "$($env:BINARY_ARTIFACT_NAME).zip"

          gh release create $env:RELEASE_TAG $HashNamedArchivePath $StableArchivePath --title $env:RELEASE_TAG --generate-notes --prerelease
