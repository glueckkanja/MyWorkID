name: Create MyWorkID Release
run-name: Create MyWorkID Release

concurrency:
  group: "Create MyWorkID Release"
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
    branches:
      - "main"

permissions:
  contents: write
  actions: read

env:
  BINARY_ARTIFACT_NAME: binaries
  RELEASE_ASSETS_DIRECTORY: release-assets

jobs:
  build_myworkid_binaries:
    uses: ./.github/workflows/build-binaries-reusable.yml

  prepare_release_assets:
    name: Prepare release assets
    runs-on: ubuntu-latest
    needs: build_myworkid_binaries
    steps:
      - name: Download binaries artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.BINARY_ARTIFACT_NAME }}_${{ github.sha }}
          path: ${{ env.RELEASE_ASSETS_DIRECTORY }}

      - name: Duplicate archive as binaries.zip
        shell: pwsh
        run: |
          $ReleaseAssetsDirectory = Join-Path $env:GITHUB_WORKSPACE $env:RELEASE_ASSETS_DIRECTORY
          $HashNamedArchivePath = Join-Path $ReleaseAssetsDirectory "$($env:BINARY_ARTIFACT_NAME)_$($env:GITHUB_SHA).zip"
          $StableArchivePath = Join-Path $ReleaseAssetsDirectory "$($env.BINARY_ARTIFACT_NAME).zip"

          if (-not (Test-Path $HashNamedArchivePath)) {
            throw "Expected archive '$($env:BINARY_ARTIFACT_NAME)_$($env:GITHUB_SHA).zip' was not found in '$ReleaseAssetsDirectory'."
          }

          Copy-Item -Path $HashNamedArchivePath -Destination $StableArchivePath -Force

      - name: Upload prepared release assets
        uses: actions/upload-artifact@v7
        with:
          name: release_${{ env.BINARY_ARTIFACT_NAME }}_${{ github.sha }}
          path: ${{ env.RELEASE_ASSETS_DIRECTORY }}/*.zip

  generate_version:
    name: Generate prerelease version number
    needs: prepare_release_assets
    uses: c4a8/c4a8-code-reusable-actions/.github/workflows/epoch-semver-version.yml@8222fbca3416c3396bfcd6372b58e2b422302a58 # v1.0.2
    with:
      suppress_release: true
      is_prerelease: true
      prerelease_name: prerelease

  create_release:
    name: Create prerelease
    runs-on: ubuntu-latest
    needs:
      - prepare_release_assets
      - generate_version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download prepared release assets
        uses: actions/download-artifact@v5
        with:
          name: release_${{ env.BINARY_ARTIFACT_NAME }}_${{ github.sha }}
          path: ${{ env.RELEASE_ASSETS_DIRECTORY }}

      - name: Resolve release version
        id: resolve_release_version
        shell: pwsh
        run: |
          $ReleaseTag = git tag --points-at $env:GITHUB_SHA --list 'v*-prerelease.*' | Select-Object -First 1

          if ([string]::IsNullOrWhiteSpace($ReleaseTag)) {
            throw 'No prerelease tag was found for the current commit.'
          }

          "release_tag=$ReleaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.resolve_release_version.outputs.release_tag }}
        run: |
          $ReleaseAssetsDirectory = Join-Path $env:GITHUB_WORKSPACE $env:RELEASE_ASSETS_DIRECTORY
          $HashNamedArchivePath = Join-Path $ReleaseAssetsDirectory "$($env:BINARY_ARTIFACT_NAME)_$($env:GITHUB_SHA).zip"
          $StableArchivePath = Join-Path $ReleaseAssetsDirectory "$($env.BINARY_ARTIFACT_NAME).zip"

          gh release create $env:RELEASE_TAG $HashNamedArchivePath $StableArchivePath --title $env:RELEASE_TAG --generate-notes --prerelease
